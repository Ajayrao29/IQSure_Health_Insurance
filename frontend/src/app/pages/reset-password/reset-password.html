<!-- Template for the reset-password page -->
<div class="auth-wrapper">
  <div class="auth-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
  <div class="auth-content">
    <div class="auth-logo">
      <div class="logo-inner">
        <span class="logo-text">IQsure 🛡️</span>
      </div>
    </div>
    <div class="auth-card glass-card fade-in">
      <div class="auth-header">
        <div class="header-icon">
          <div class="icon-pulse"></div>
          <span class="icon">🔓</span>
        </div>
        <h1>New Secure Password</h1>
        <p>Set a strong password to protect your insurance vault.</p>
      </div>
      <div *ngIf="error" class="alert alert-error slide-up">
        <span class="alert-icon">⚠️</span>
        {{ error }}
      </div>
      <div *ngIf="success" class="alert alert-success slide-up">
        <div class="success-wrap">
          <span class="alert-icon">✨</span>
          <div class="msg-content">
            <strong>Password Updated</strong>
            <p>{{ message }}</p>
          </div>
        </div>
        <div class="redirect-progress"></div>
      </div>
      <form (ngSubmit)="onSubmit()" *ngIf="!success" class="auth-form">
        <div class="form-group">
          <label for="otp">OTP (Verification Code)</label>
          <div class="input-wrapper otp-mode">
            <span class="input-icon">🔢</span>
            <input
              type="text"
              id="otp"
              name="otp"
              [(ngModel)]="otp"
              placeholder="Enter 6-digit code"
              maxlength="6"
              required>
          </div>
        </div>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              [(ngModel)]="newPassword"
              placeholder="Min 6 characters"
              required>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔁</span>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Repeat new password"
              required>
          </div>
        </div>
        <button type="submit" class="btn-primary w-full" [disabled]="loading">
          <span *ngIf="!loading">Reset My Password</span>
          <span *ngIf="loading" class="btn-loader"></span>
        </button>
        <div class="auth-footer">
          <p>Didn't get the code? <a routerLink="/forgot-password" class="link-highlight">Try again</a></p>
        </div>
      </form>
    </div>
    <div class="auth-tagline">
      Secure. Smart. Simply Pink.
    </div>
  </div>
</div>
